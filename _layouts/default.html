<!DOCTYPE html>
<html lang="{{ site.lang | default: " en-US" }}">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap"
    rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ " /assets/css/modern.css" | relative_url }}">
</head>

<body>
  <header>
    <nav class="container">
      <div class="logo">{{ site.title }}</div>
      <div class="nav-links">
        <a href="#work">Work</a>
        <a href="#papers">Papers</a>
        <a href="/blog/">Blog</a>
      </div>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Hosted on GitHub Pages.</p>
    </div>
  </footer>

  <script src="{{ " /assets/js/main.js" | relative_url }}"></script>
</body>

</html>
