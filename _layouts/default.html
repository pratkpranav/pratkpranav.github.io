<!DOCTYPE html>
<html lang="{{ site.lang | default: " en-US" }}">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>



  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/modern.css?v={{ site.time | date: '%s' }}">
</head>

<body>
  <header>
    <nav class="container">
      <div class="logo">{{ site.title }}</div>
      <div class="nav-links">
        <a href="#work">Work</a>
        <a href="#papers">Papers</a>
        <a href="/blog/">Blog</a>
      </div>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Hosted on GitHub Pages.</p>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
</body>

</html>
